# Controllo gratuito della coda "Aggiornamenti dashboard".
# Legge /api/claude/aggiornamenti e fa partire il task programmato di Claude
# solo se ci sono richieste nuove, così il task non consuma crediti a vuoto.
#
# Usa solo il secret CRON_SECRET (già presente). Il token dell'API trigger del task
# è in .github/aggiornamenti-fire-token.enc, cifrato con CRON_SECRET (scelta di Alessio, 15/11/2026).
# Il token può solo avviare questo task. Per cambiarlo: claude.ai/code/routines > task > Modifica > API > Rigenera,
# poi: printf '%s' "$TOKEN" | openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -a -A -pass env:CRON_SECRET > .github/aggiornamenti-fire-token.enc
name: Coda aggiornamenti

on:
  schedule:
    # Ogni ora dalle 8 alle 20 circa, ora di Roma (orari GitHub in UTC, possono slittare).
    - cron: "17 7-19 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Fai partire il task anche se la coda è vuota (prova)"
        type: boolean
        default: false

concurrency:
  group: aggiornamenti-gate
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - name: Leggi la coda e avvia il task se serve
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FIRE_URL: https://api.anthropic.com/v1/claude_code/routines/trig_011Ke21EAst5n65orHE4PEFy/fire
          FORCE: ${{ inputs.force || false }}
        run: |
          set -euo pipefail
          queue=$(curl -sS --fail-with-body --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://elerent-dashboard.vercel.app/api/claude/aggiornamenti)

          # Richieste mai prese in carico.
          nuove=$(jq '[.pending[] | select(.claudeStatus == null)] | length' <<<"$queue")
          # Richieste rimaste "in lavorazione": si riprovano una volta al giorno (giro delle 12 UTC).
          ferme=$(jq '[.pending[] | select(.claudeStatus == "in_lavorazione")] | length' <<<"$queue")
          echo "Richieste nuove: $nuove, in lavorazione: $ferme"

          motivo=""
          if [ "$FORCE" = "true" ]; then motivo="prova manuale"
          elif [ "$nuove" -gt 0 ]; then motivo="$nuove richieste nuove"
          elif [ "$ferme" -gt 0 ] && [ "$(date -u +%H)" = "12" ]; then motivo="$ferme richieste ancora in lavorazione"
          fi

          if [ -z "$motivo" ]; then
            echo "Niente da fare, il task non parte."
            exit 0
          fi

          FIRE_TOKEN=$(openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -a -A -pass env:CRON_SECRET < .github/aggiornamenti-fire-token.enc)
          echo "::add-mask::$FIRE_TOKEN"

          echo "Avvio il task: $motivo"
          curl -sS --fail-with-body --max-time 60 -X POST "$FIRE_URL" \
            -H "Authorization: Bearer $FIRE_TOKEN" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "anthropic-version: 2023-06-01" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg t "Avviato dal controllo coda GitHub: $motivo." '{text: $t}')"
